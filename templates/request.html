
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Food | FoodRescue AI</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header>
    <div class="logo">FoodRescue <span>AI</span></div>

    <nav>
    <a href="/">Home</a>
    <a href="/donate">Donate Food</a>
    <a href="/listings">Find Food</a>
    <a href="/matching">Smart Matching</a>
    <a href="/requests">Manage Requests</a>
    <a href="/#about">About</a>
    <a href="/chatbot">RescueBot 🤖</a>
</nav>
</header>

<section class="about">

    <h2>Request Food</h2>

    <p>Fill in your details to request available surplus food.</p>

    <form action="/submit-request/{{ donation_id }}"
          method="POST"
          class="donation-form">

        <label>Recipient Name</label>
        <input type="text" name="recipient_name" required>

        <label>Organization Name (if applicable)</label>
        <input type="text" name="organization">

        <label>Contact Number</label>
        <input type="tel" name="contact" required>

        <label>Required Quantity</label>
        <input type="number" name="requested_quantity"
               min="1" required>

        <label>Purpose of Request</label>
        <textarea name="purpose"
                  placeholder="Explain who the food is intended for"></textarea>

        <button type="submit" class="btn primary">
            Submit Food Request
        </button>

    </form>

</section>

<footer>
    <p>© 2026 FoodRescue AI | Save Food. Share Hope.</p>
</footer>

</body>
</html>
